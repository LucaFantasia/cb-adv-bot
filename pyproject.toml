[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "cb-adv-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "python-dotenv>=1",
  "pandas>=2",
  "numpy>=2",
  "matplotlib>=3",
  "requests>=2.32",
  "PyJWT>=2.9",
  "cryptography>=43",
  "mplfinance==0.12.10b0",
  "websocket-client>=1.8",
  "typer>=0.12",
  "rich>=13"
]

[project.scripts]
cb = "cli:main"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
lint.select = ["E","F","I","UP","B","SIM","PL","TCH"]
lint.ignore = ["E501"]
fix = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disable_error_code = ["import-untyped"]
plugins = ["pydantic.mypy"]


[[tool.mypy.overrides]]
module = "mplfinance"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mplfinance.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --maxfail=1 --disable-warnings"
pythonpath = ["src", "tests"]
