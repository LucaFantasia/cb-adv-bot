name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: pip install -U -e . ruff black isort mypy pytest
      - run: pip install -U pandas-stubs types-requests
      - run: ruff check .
      - run: mypy src
      - run: pytest
